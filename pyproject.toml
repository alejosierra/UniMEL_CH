[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unimel"
version = "0.1.0"
description = "UniMEL: A Unified Framework for Multimodal Entity Linking with Large Language Models"
readme = "README.md"
requires-python = "==3.8.18"
dependencies = [
    "torch==2.2.1",
    "transformers==4.39.1",
    "modelscope==1.13.3",
    "ms-swift==2",
    "omegaconf==2.2.3",
]

[tool.uv]
package = false