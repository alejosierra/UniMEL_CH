[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unimel"
version = "0.1.0"
description = "UniMEL: A Unified Framework for Multimodal Entity Linking with Large Language Models"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "torch==2.2.1",
    "transformers==4.43.*",
    "ms-swift==3.*",
    "omegaconf==2.2.3",
    "einops>=0.8.2",
    "modelscope>=1.31.0",
    "addict>=2.4.0",
]

[tool.uv]
package = false

